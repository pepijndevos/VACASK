name: CI

on:
  push:
    branches: [main]
    tags: ['_*']
  pull_request:
    branches: [main]

# A newer push to the same branch/PR supersedes older runs. Tag (release) runs
# are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_34_x86_64
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_34_aarch64
            name: Linux aarch64
          - os: macos-15
            name: macOS
          - os: windows-latest
            name: Windows

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Linux builds run inside manylinux_2_34 (AlmaLinux 9, glibc 2.34) to produce
    # portable binaries; macOS/Windows leave this empty and run on the host.
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: ci/install-deps.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: ci/install-deps.sh

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git bison flex
          pacboy: >-
            gcc:p cmake:p ninja:p boost:p suitesparse:p fftw:p
            tomlplusplus:p llvm:p clang:p lld:p rust:p python:p
            python-numpy:p python-scipy:p python-matplotlib:p dlfcn:p

      - name: Cache OpenVAF-Reloaded build
        id: cache-openvaf
        uses: actions/cache@v5
        with:
          path: openvaf-cache
          key: openvaf-${{ matrix.os }}-${{ runner.arch }}-osdi-0.5-v1

      - name: Build OpenVAF-Reloaded (Unix)
        if: steps.cache-openvaf.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: ci/build-openvaf.sh "$GITHUB_WORKSPACE/openvaf-cache"

      - name: Build OpenVAF-Reloaded (Windows)
        if: steps.cache-openvaf.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/build-openvaf.sh "$(cygpath -u "$GITHUB_WORKSPACE")/openvaf-cache"

      - name: Setup OpenVAF-Reloaded path (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "$GITHUB_WORKSPACE/openvaf-cache/openvaf-r"
          echo "OPENVAF_DIR=$GITHUB_WORKSPACE/openvaf-cache" >> "$GITHUB_ENV"

      - name: Setup OpenVAF-Reloaded path (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "OPENVAF_DIR=$(cygpath -u "$GITHUB_WORKSPACE")/openvaf-cache" >> "$GITHUB_ENV"

      - name: Keep OpenVAF-Reloaded for the wheels job
        uses: actions/upload-artifact@v6
        with:
          name: openvaf-${{ matrix.os }}
          path: |
            openvaf-cache/openvaf-r
            openvaf-cache/openvaf-r.exe
          if-no-files-found: error

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: ci/build-vacask.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/build-vacask.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Bundle shared libraries (Unix)
        if: runner.os != 'Windows'
        run: ci/bundle.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Bundle shared libraries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/bundle.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vacask-${{ matrix.os }}
          path: |
            build/simulator/
            !build/simulator/CMakeFiles/
            !build/simulator/cmake_install.cmake
            !build/simulator/CTestTestfile.cmake
            build/lib/
          if-no-files-found: warn

  wheels:
    # Python extension (vacask package, scikit-build-core + pybind11).
    # Runs after the build job, which provides the openvaf-r binary.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux aarch64
          - os: macos-15
            name: macOS
          - os: windows-latest
            name: Windows

    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Passed as an artifact: the Linux cache entry is written from inside the
      # manylinux container and is not necessarily restorable on the host.
      - name: Fetch OpenVAF-Reloaded
        uses: actions/download-artifact@v6
        with:
          name: openvaf-${{ matrix.os }}
          path: openvaf-cache

      - name: Make openvaf-r executable
        if: runner.os != 'Windows'
        run: chmod +x openvaf-cache/openvaf-r

      # Windows: the extension is built with the same MSYS2 MinGW toolchain as the
      # simulator, against the (MSVC-built) python.org CPython, and the MinGW
      # runtime DLLs are bundled with delvewheel (see pyproject.toml).
      - name: Setup MSYS2 (Windows)
        id: msys
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git bison flex
          pacboy: >-
            gcc:p cmake:p ninja:p boost:p suitesparse:p fftw:p
            tomlplusplus:p dlfcn:p llvm:p clang:p lld:p

      - name: Compute forward-slash paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "MSYS_ROOT=$(cygpath -m '${{ steps.msys.outputs.msys2-location }}')" >> "$GITHUB_ENV"
          echo "WS=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/_* ]]; then
            V="${GITHUB_REF_NAME#_}"; V="${V//-/.}"
          else
            V="0.0.0.dev0+g${GITHUB_SHA::8}"
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$V" >> "$GITHUB_ENV"

      - name: Setup Rust (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BEFORE_ALL_MACOS: ci/install-deps.sh
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_GENERATOR=Ninja
            CC=gcc
            CXX=g++
            PATH="$MSYS_ROOT/mingw64/bin;$PATH;$MSYS_ROOT/usr/bin"
            CMAKE_ARGS="-DOPENVAF_DIR=$WS/openvaf-cache
            -DSuiteSparse_DIR=$MSYS_ROOT/mingw64
            -DTOMLPP_DIR=$MSYS_ROOT/mingw64
            -DBoost_ROOT=$MSYS_ROOT/mingw64
            -DOPENBLAS_DIR=$MSYS_ROOT/mingw64
            -DBISON_EXECUTABLE=$MSYS_ROOT/usr/bin/bison.exe
            -DFLEX_EXECUTABLE=$MSYS_ROOT/usr/bin/flex.exe
            -DFLEX_INCLUDE_DIR=$MSYS_ROOT/usr/include"
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=15.0
            CMAKE_PREFIX_PATH="$(brew --prefix openblas):$(brew --prefix libomp)"
            CMAKE_ARGS="-DOPENVAF_DIR=$GITHUB_WORKSPACE/openvaf-cache
            -DFLEX_INCLUDE_DIR=$(brew --prefix)/opt/flex/include
            -DBoost_USE_STATIC_LIBS=ON -DBLA_VENDOR=OpenBLAS
            -DOPENBLAS_DIR=$(brew --prefix openblas)"

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  wheels-pyodide:
    # Python extension for Pyodide (WebAssembly), experimental: there are no
    # wasm device models (OSDI) yet, so only circuits made of builtin devices
    # can be simulated (python/tests/test_builtin_devices.py runs in the wheel
    # test step). Not part of the release: the artifact is named
    # "pyodide-wheels" so the release job's "wheels-*" download does not pick it
    # up. The native libraries are built from source (ci/build-wasm-deps.sh):
    # Pyodide's own library packages cannot be depended on from a PyPI wheel.
    name: Wheels (Pyodide)
    runs-on: ubuntu-24.04
    env:
      # Must match the Emscripten of the Pyodide platform that is built:
      # pyemscripten_2025_0 (Python 3.13) uses Emscripten 4.0.9. Other Python
      # versions need other Emscripten versions, hence their own dependency build.
      EMSCRIPTEN_VERSION: 4.0.9
      PYODIDE_BUILD: cp313-pyodide_wasm32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y bison flex ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Cache wasm dependencies
        id: wasm-deps-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/wasm-deps
          key: wasm-deps-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('ci/build-wasm-deps.sh') }}

      - name: Build wasm dependencies
        if: steps.wasm-deps-cache.outputs.cache-hit != 'true'
        run: ci/build-wasm-deps.sh "$RUNNER_TEMP/wasm-deps" "$RUNNER_TEMP/wasm-deps-work"

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/_* ]]; then
            V="${GITHUB_REF_NAME#_}"; V="${V//-/.}"
          else
            V="0.0.0.dev0+g${GITHUB_SHA::8}"
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build wheel
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: ${{ env.PYODIDE_BUILD }}
          WASM_DEPS_DIR: ${{ runner.temp }}/wasm-deps

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: pyodide-wheels
          path: wheelhouse/*.whl

  vacask-bin-tests:
    name: Test vacask-bin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install pytest && python -m pytest python/vacask-bin

  release:
    if: startsWith(github.ref, 'refs/tags/_')
    needs: [build, wheels, vacask-bin-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # First: checkout cleans the workspace. Needed for python/vacask-bin.
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: vacask-*

      - name: Package release archives
        run: |
          VERSION="${GITHUB_REF_NAME#_}"
          echo "Version: $VERSION"

          cd artifacts

          # Linux tar.gz (manylinux_2_34, glibc 2.34)
          tar czf "../vacask_${VERSION}_linux-x86_64.tar.gz" -C vacask-ubuntu-24.04 .
          tar czf "../vacask_${VERSION}_linux-aarch64.tar.gz" -C vacask-ubuntu-24.04-arm .

          # macOS tar.gz
          tar czf "../vacask_${VERSION}_darwin-arm64.tar.gz" -C vacask-macos-15 .

          # Windows zip
          cd vacask-windows-latest
          zip -r "../../vacask_${VERSION}_windows-x86_64.zip" .
          cd ..

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build vacask-bin wheels from the archives above
        run: |
          python python/vacask-bin/build_wheels.py \
            --release-tag "$GITHUB_REF_NAME" --cache-dir . --output-dir dist-bin

      - name: Download extension wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-ext

      - name: Keep wheels for PyPI upload
        uses: actions/upload-artifact@v6
        with:
          name: pypi-dists
          path: |
            dist-bin/
            dist-ext/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: VACASK ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            vacask_*.tar.gz
            vacask_*.zip
            dist-bin/*.whl
            dist-ext/*.whl

  # PyPI trusted publishing: each project must list this repository, workflow
  # file (ci.yml) and environment (pypi) as a trusted publisher on pypi.org.
  pypi-vacask-bin:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vacask-bin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-dists
          path: all
      - name: Publish vacask-bin
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: all/dist-bin
          skip-existing: true

  pypi-vacask:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vacask
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-dists
          path: all
      - name: Publish vacask
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: all/dist-ext
          skip-existing: true
