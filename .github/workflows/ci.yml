name: CI

on:
  push:
    branches: [main]
    tags: ['_*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_34_x86_64
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_34_aarch64
            name: Linux aarch64
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Linux builds run inside manylinux_2_34 (AlmaLinux 9, glibc 2.34) to produce
    # portable binaries; macOS/Windows leave this empty and run on the host.
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: ci/install-deps.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: ci/install-deps.sh

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git bison flex
          pacboy: >-
            gcc:p cmake:p ninja:p boost:p suitesparse:p
            tomlplusplus:p llvm:p clang:p lld:p rust:p python:p
            python-numpy:p python-scipy:p python-matplotlib:p dlfcn:p

      - name: Cache OpenVAF-Reloaded build
        id: cache-openvaf
        uses: actions/cache@v5
        with:
          path: openvaf-cache
          key: openvaf-${{ matrix.os }}-${{ runner.arch }}-osdi-0.5-v1

      - name: Build OpenVAF-Reloaded (Unix)
        if: steps.cache-openvaf.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: ci/build-openvaf.sh "$GITHUB_WORKSPACE/openvaf-cache"

      - name: Build OpenVAF-Reloaded (Windows)
        if: steps.cache-openvaf.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/build-openvaf.sh "$(cygpath -u "$GITHUB_WORKSPACE")/openvaf-cache"

      - name: Setup OpenVAF-Reloaded path (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "$GITHUB_WORKSPACE/openvaf-cache/openvaf-r"
          echo "OPENVAF_DIR=$GITHUB_WORKSPACE/openvaf-cache" >> "$GITHUB_ENV"

      - name: Setup OpenVAF-Reloaded path (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "OPENVAF_DIR=$(cygpath -u "$GITHUB_WORKSPACE")/openvaf-cache" >> "$GITHUB_ENV"

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: ci/build-vacask.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/build-vacask.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Bundle shared libraries (Unix)
        if: runner.os != 'Windows'
        run: ci/bundle.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Bundle shared libraries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ci/bundle.sh --openvaf-dir "$OPENVAF_DIR"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vacask-${{ matrix.os }}
          path: |
            build/simulator/
            !build/simulator/CMakeFiles/
            !build/simulator/cmake_install.cmake
            !build/simulator/CTestTestfile.cmake
            build/lib/
          if-no-files-found: warn

  wheels:
    # Python extension (vacask package, scikit-build-core + pybind11).
    # Runs after the build job so that the openvaf-r binary is in the cache.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux aarch64
          - os: macos-14
            name: macOS

    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore OpenVAF-Reloaded build
        uses: actions/cache/restore@v5
        with:
          path: openvaf-cache
          key: openvaf-${{ matrix.os }}-${{ runner.arch }}-osdi-0.5-v1

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/_* ]]; then
            V="${GITHUB_REF_NAME#_}"; V="${V//-/.}"
          else
            V="0.0.0.dev0+g${GITHUB_SHA::8}"
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$V" >> "$GITHUB_ENV"

      - name: Setup Rust (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BEFORE_ALL_MACOS: ci/install-deps.sh
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_ARGS="-DOPENVAF_DIR=$GITHUB_WORKSPACE/openvaf-cache
            -DFLEX_INCLUDE_DIR=$(brew --prefix)/opt/flex/include
            -DBoost_USE_STATIC_LIBS=ON -DBLA_VENDOR=OpenBLAS
            -DCMAKE_PREFIX_PATH=$(brew --prefix openblas)
            -DOPENBLAS_DIR=$(brew --prefix openblas)"

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  vacask-bin-tests:
    name: Test vacask-bin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install pytest && python -m pytest python/vacask-bin

  release:
    if: startsWith(github.ref, 'refs/tags/_')
    needs: [build, wheels, vacask-bin-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: vacask-*

      - name: Package release archives
        run: |
          VERSION="${GITHUB_REF_NAME#_}"
          echo "Version: $VERSION"

          cd artifacts

          # Linux tar.gz (manylinux_2_34, glibc 2.34)
          tar czf "../vacask_${VERSION}_linux-x86_64.tar.gz" -C vacask-ubuntu-24.04 .
          tar czf "../vacask_${VERSION}_linux-aarch64.tar.gz" -C vacask-ubuntu-24.04-arm .

          # macOS tar.gz
          tar czf "../vacask_${VERSION}_darwin-arm64.tar.gz" -C vacask-macos-14 .

          # Windows zip
          cd vacask-windows-latest
          zip -r "../../vacask_${VERSION}_windows-x86_64.zip" .
          cd ..

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build vacask-bin wheels from the archives above
        run: |
          python python/vacask-bin/build_wheels.py \
            --release-tag "$GITHUB_REF_NAME" --cache-dir . --output-dir dist-bin

      - name: Download extension wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-ext

      - name: Keep wheels for PyPI upload
        uses: actions/upload-artifact@v6
        with:
          name: pypi-dists
          path: |
            dist-bin/
            dist-ext/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: VACASK ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            vacask_*.tar.gz
            vacask_*.zip
            dist-bin/*.whl
            dist-ext/*.whl

  # PyPI trusted publishing: each project must list this repository, workflow
  # file (ci.yml) and environment (pypi) as a trusted publisher on pypi.org.
  pypi-vacask-bin:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vacask-bin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-dists
          path: all
      - name: Publish vacask-bin
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: all/dist-bin
          skip-existing: true

  pypi-vacask:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vacask
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: pypi-dists
          path: all
      - name: Publish vacask
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: all/dist-ext
          skip-existing: true
