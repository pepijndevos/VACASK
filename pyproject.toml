[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "vacask"
authors = [
  { name="Arpad Buermen", email="arpad.burmen@fe.uni-lj.si" },
]
description = "VACASK (Verilog-A Circuit Analysis Kernel) is an analog circuit simulator. "
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "numpy",
    "matplotlib"
]

[tool.pytest.ini_options]
addopts = ""
testpaths = [
    "tests",
]

[tool.scikit-build]
wheel.packages = ["python/src/vacask"]
wheel.exclude = ["_version.py.in"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
tag_regex = "^_(?P<version>.*)$"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *_i686 *-win32 *-win_arm64"
test-command = "python -c \"import vacask; print(vacask.simulator)\""
# The tag is _X.Y.Z[-devN]; setuptools_scm cannot derive a version with commit
# distance from it, so CI passes the version in explicitly.
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
# Same toolchain as the binary build (ci/). openvaf-r is restored from the CI
# cache into the project directory, so build-openvaf.sh normally does nothing.
before-all = "ci/install-deps.sh && ci/build-openvaf.sh /project/openvaf-cache"
environment = { CMAKE_ARGS = "-DOPENVAF_DIR=/project/openvaf-cache -DBoost_ROOT=/tmp/boost_1_88_0/stage -DSuiteSparse_DIR=/usr -DTOMLPP_DIR=/usr/local" }
